name: ci

on:
  push:
  pull_request:

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: public/models
          key: models-${{ hashFiles('tools/fetch-models/models.lock.json') }}
      - run: npm run models:fetch
      - run: npm run fixtures:build
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run arch
      - run: npm run test:coverage
      - run: npm run coverage:guard
      - run: npm run build
      - run: npx playwright install --with-deps
      - run: npm run test:e2e

  ner-eval:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run models:fetch
      - run: npm run fixtures:build
      - run: npm run eval:ner
